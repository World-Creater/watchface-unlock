<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解锁后台</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#16181d; --dim:#6b7280; --line:#e3e6ea;
          --accent:#1f7a3f; --soft:#e8f3ec; --red:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
         font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:12px; }
  input[type=password], input[type=text] {
    width:100%; padding:11px; font-size:16px; border:1px solid var(--line);
    border-radius:9px; background:#fbfbfc;
  }
  button { padding:10px 14px; font-size:15px; border-radius:9px; border:0;
           background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  button.danger { background:#fff; color:var(--red); border:1px solid #f0c9c9; font-weight:500; }
  button:disabled { opacity:.5; }
  .item { border-top:1px solid var(--line); padding:12px 0; }
  .item:first-of-type { border-top:0; }
  .line { display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--dim); }
  .line b { color:var(--ink); font-weight:600; font-family:ui-monospace,Consolas,monospace; }
  .acts { display:flex; gap:8px; margin-top:10px; }
  .acts button { flex:1; }
  .code { font:700 22px/1.3 ui-monospace,Consolas,monospace; letter-spacing:2px;
          color:var(--accent); margin-top:8px; }
  .empty { color:var(--dim); text-align:center; padding:18px 0; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .muted { color:var(--dim); font-size:12px; }
  .err { color:var(--red); font-size:13px; margin-top:8px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>解锁后台</h1>

  <div class="card" id="gate">
    <div class="muted">输入管理密码</div>
    <input type="password" id="pw" placeholder="管理密码" autocomplete="current-password">
    <div class="acts"><button id="login">进入</button></div>
    <div class="err" id="gateErr"></div>
  </div>

  <div class="card hide" id="panel">
    <div class="bar">
      <span id="count" class="muted">加载中…</span>
      <span>
        <button class="ghost" id="refresh">刷新</button>
        <button class="ghost" id="logout">退出</button>
      </span>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var API = (window.API_BASE || "").replace(/\/+$/, "");
  var NAMES = { VS: "VISION", SP: "Summit" };
  var pw = localStorage.getItem("unlock_admin_pw") || "";
  var timer = null;

  var gate = document.getElementById("gate");
  var panel = document.getElementById("panel");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");

  function post(path, body) {
    var full = (API || "(config.js 里没有填地址)") + path;
    return fetch(API + path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (x) { j = null; }
        if (!r.ok) {
          var e = new Error((j && j.error) || ("HTTP " + r.status));
          e.status = r.status;
          e.detail = j && j.detail;
          throw e;
        }
        if (!j) { throw new Error("服务器返回了非 JSON 内容：" + String(t).slice(0, 120)); }
        return j;
      });
    }, function (err) {
      throw new Error("连不上 " + full + " —— " + (err && err.message ? err.message : String(err)));
    });
  }

  function fmt(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function render(items) {
    countEl.textContent = items.length ? items.length + " 单待处理" : "没有待处理的单";
    if (!items.length) { listEl.innerHTML = '<div class="empty">暂无待处理</div>'; return; }
    listEl.innerHTML = "";
    items.forEach(function (it) {
      var div = document.createElement("div");
      div.className = "item";
      div.innerHTML =
        '<div class="line"><span>' + (NAMES[it.product] || it.product) + '</span><span>' + fmt(it.ts) + '</span></div>' +
        '<div class="line"><span>设备 ID</span><b>' + it.deviceId + '</b></div>' +
        '<div class="line"><span>订单号</span><b>' + it.order + '</b></div>' +
        '<div class="acts">' +
          '<button data-act="approve">通过</button>' +
          '<button class="danger" data-act="reject">拒绝</button>' +
        '</div>' +
        '<div class="err hide"></div>';
      div.querySelector('[data-act=approve]').onclick = function () { decide(it.id, "approve", div); };
      div.querySelector('[data-act=reject]').onclick = function () { decide(it.id, "reject", div); };
      listEl.appendChild(div);
    });
  }

  function load() {
    if (!API) { document.getElementById("gateErr").textContent = "config.js 里没有配置后端地址"; return; }
    post("/api/admin/list", { password: pw }).then(function (j) {
      gate.classList.add("hide");
      panel.classList.remove("hide");
      render(j.items);
    }).catch(function (e) {
      if (e.status === 401) { logout(); document.getElementById("gateErr").textContent = "密码不对"; return; }
      var msg = e.message || "未知错误";
      if (e.detail) msg += " · " + e.detail;
      document.getElementById("gateErr").textContent = "登录失败：" + msg;
    });
  }

  function decide(id, action, div) {
    var btns = div.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
    post("/api/admin/decide", { password: pw, id: id, action: action }).then(function (j) {
      if (action === "approve") {
        div.querySelector(".acts").innerHTML = '<div class="code">' + j.code + '</div>';
        div.querySelector(".err").classList.add("hide");
        div.style.opacity = ".75";
        var left = parseInt(countEl.textContent, 10) - 1;
        countEl.textContent = left > 0 ? left + " 单待处理" : "没有待处理的单";
      } else {
        div.style.opacity = ".4";
        div.querySelector(".acts").innerHTML = '<span class="muted">已拒绝</span>';
      }
    }).catch(function (e) {
      var err = div.querySelector(".err");
      err.textContent = e.message;
      err.classList.remove("hide");
      for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
    });
  }

  function logout() {
    localStorage.removeItem("unlock_admin_pw");
    pw = "";
    if (timer) { clearInterval(timer); timer = null; }
    panel.classList.add("hide");
    gate.classList.remove("hide");
  }

  document.getElementById("login").onclick = function () {
    pw = document.getElementById("pw").value.trim();
    if (!pw) return;
    localStorage.setItem("unlock_admin_pw", pw);
    document.getElementById("gateErr").textContent = "";
    load();
  };
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("login").click();
  });
  document.getElementById("refresh").onclick = load;
  document.getElementById("logout").onclick = logout;

  if (pw) { document.getElementById("pw").value = pw; load(); }
  timer = setInterval(function () { if (pw) load(); }, 15000);
})();
</script>
</body>
</html>
